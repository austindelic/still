version = "15.1.0"

[source]
type = "github-release"
repo = "BurntSushi/ripgrep"
tag = "{version}"
asset = "ripgrep-{version}-{target}.tar.gz"
strip_prefix = "ripgrep-{version}-{target}"

[artifacts.macos-aarch64]
target = "aarch64-apple-darwin"
sha256 = "..."

[artifacts.macos-x86_64]
target = "x86_64-apple-darwin"
sha256 = "..."

[artifacts.linux-x86_64]
target = "x86_64-unknown-linux-musl"
sha256 = "..."

[install]
bins = ["rg"]
man = ["doc/rg.1"]

[install.completions]
bash = "complete/rg.bash"
zsh = "complete/_rg"
