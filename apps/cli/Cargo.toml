[package]
name = "still"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "still"
path = "src/main.rs"

[workspace]
members = [
  "crates/engine",
  "crates/source-kit",
  "crates/sources/aqua",
  "crates/sources/apt",
  "crates/sources/cargo",
  "crates/sources/dnf",
  "crates/sources/flatpak",
  "crates/sources/go",
  "crates/sources/homebrew",
  "crates/sources/npm",
  "crates/sources/pacman",
  "crates/sources/pipx",
  "crates/sources/winget",
  "crates/tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.102"
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
indicatif = "0.18.4"
miette = { version = "7.6.0", features = ["fancy"] }
ratatui = "0.29.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "gzip",
  "rustls",
] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false }
toml = "1.1.2"
toml_edit = { version = "0.25.12", features = ["serde"] }
insta = "1.47.2"

[dependencies]
anyhow = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
engine = { path = "crates/engine" }
indicatif = { workspace = true }
miette = { workspace = true }
still_tui = { package = "still-tui", path = "crates/tui", optional = true }
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread"] }

[dev-dependencies]
clap = { workspace = true }
insta = { workspace = true }

[features]
default = []
source-aqua = ["engine/source-aqua"]
source-apt = ["engine/source-apt"]
source-cargo = ["engine/source-cargo"]
source-dnf = ["engine/source-dnf"]
source-flatpak = ["engine/source-flatpak"]
source-go = ["engine/source-go"]
source-homebrew = ["engine/source-homebrew"]
source-kit = ["engine/source-kit"]
source-npm = ["engine/source-npm"]
source-pacman = ["engine/source-pacman"]
source-pipx = ["engine/source-pipx"]
source-winget = ["engine/source-winget"]
sources = [
  "source-aqua",
  "source-apt",
  "source-cargo",
  "source-dnf",
  "source-flatpak",
  "source-go",
  "source-homebrew",
  "source-npm",
  "source-pacman",
  "source-pipx",
  "source-winget",
]
tui = ["dep:still_tui"]

# Normal production build.
# Good runtime performance, still stripped.
[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false

# Smallest practical build.
# Slower to compile, may be slightly slower at runtime.
[profile.tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false
