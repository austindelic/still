[package]
name = "still"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "still"
path = "src/main.rs"

[workspace]
members = ["crates/engine", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.49.0", default-features = false }

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.53", features = ["derive"] }
engine = { path = "crates/engine" }
still_tui = { package = "still-tui", path = "crates/tui", optional = true }

[dev-dependencies]
insta = "1.44.1"

[features]
default = []
tui = ["dep:still_tui"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
