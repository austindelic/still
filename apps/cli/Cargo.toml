[package]
name = "still"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "still"
path = "src/main.rs"

[workspace]
members = [
  "crates/engine",
  "crates/source-kit",
  "crates/sources/aqua",
  "crates/sources/apt",
  "crates/sources/cargo",
  "crates/sources/dnf",
  "crates/sources/flatpak",
  "crates/sources/go",
  "crates/sources/homebrew",
  "crates/sources/npm",
  "crates/sources/pacman",
  "crates/sources/pipx",
  "crates/sources/winget",
  "crates/tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
anstream = "0.6.21"
anstyle = "1.0.13"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
indicatif = "0.18.3"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.49.0", default-features = false }
insta = "1.44.1"

[dependencies]
anyhow = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
engine = { path = "crates/engine" }
indicatif = { workspace = true }
miette = { workspace = true }
still_tui = { package = "still-tui", path = "crates/tui", optional = true }
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread"] }

[dev-dependencies]
clap = { workspace = true }
insta = { workspace = true }

[features]
default = []
source-aqua = ["engine/source-aqua"]
source-apt = ["engine/source-apt"]
source-cargo = ["engine/source-cargo"]
source-dnf = ["engine/source-dnf"]
source-flatpak = ["engine/source-flatpak"]
source-go = ["engine/source-go"]
source-homebrew = ["engine/source-homebrew"]
source-kit = ["engine/source-kit"]
source-npm = ["engine/source-npm"]
source-pacman = ["engine/source-pacman"]
source-pipx = ["engine/source-pipx"]
source-winget = ["engine/source-winget"]
sources = [
  "source-aqua",
  "source-apt",
  "source-cargo",
  "source-dnf",
  "source-flatpak",
  "source-go",
  "source-homebrew",
  "source-npm",
  "source-pacman",
  "source-pipx",
  "source-winget",
]
tui = ["dep:still_tui"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
